[build]
publish = "public"
# The dream theme is VENDORED as plain files (no git submodule), so the build
# is deterministic and needs no submodule init. HUGO_VERSION must live in a
# [build.environment] table (a bare [build] key is ignored by Netlify).
# (The post-March deploy failures were NOT Hugo: the content-security-policy
# app extension's __csp-nonce edge function imported @netlify/blobs, which
# the new build image can't resolve. Extension removed in the dashboard.)
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.167.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
# Edge functions injected at deploy time (__csp-nonce, ua_blocker_*) import
# @netlify/blobs, installed from package.json; it requires Node >= 22.12.
NODE_VERSION = "22"

[context.deploy-preview.environment]
HUGO_ENV = "preview"

[[plugins]]
  package = "netlify-plugin-inline-source"
  [plugins.inputs]
    attribute = "inline"
    compress = true
    pretty = false
    ignore = []
    svgAsImage = false

[[plugins]]
package = "netlify-plugin-image-optim"
