[build]
publish = "public"
# The dream theme is VENDORED as plain files (no git submodule), so the build
# is deterministic and needs no submodule init.
# NOTE: Netlify only turns [build.environment] / [context.*.environment] into
# env vars — HUGO_VERSION must live in an environment table or it is ignored
# and Netlify falls back to its (older) default Hugo, which cannot build this
# theme's newer layouts. This is what broke every post-March cloud deploy.
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.167.0"
HUGO_ENV = "production"

[context.production.environment]
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview.environment]
HUGO_ENV = "preview"

[[plugins]]
  package = "netlify-plugin-inline-source"
  [plugins.inputs]
    attribute = "inline"
    compress = true
    pretty = false
    ignore = []
    svgAsImage = false

[[plugins]]
package = "netlify-plugin-image-optim"
