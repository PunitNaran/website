[build]
publish = "public"
# themes/dream is a git submodule; Netlify's clone does not init it, so Hugo
# sees no layouts and fails. Init submodules before the build (root cause of
# every post-March cloud deploy failure). This single command applies to all
# contexts (production, preview, branch) — keep per-context overrides to a
# minimum so it stays in sync.
command = "git submodule update --init --recursive && hugo --gc --minify"
HUGO_VERSION = "0.167.0"
HUGO_ENV = "production"

[context.production.environment]
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview.environment]
HUGO_ENV = "preview"

[[plugins]]
  package = "netlify-plugin-inline-source"
  [plugins.inputs]
    attribute = "inline"
    compress = true
    pretty = false
    ignore = []
    svgAsImage = false

[[plugins]]
package = "netlify-plugin-image-optim"
