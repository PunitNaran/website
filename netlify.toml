[build]
publish = "public"
# The dream theme is now VENDORED as plain files (no git submodule), so the
# build is deterministic and no submodule init is needed at build time.
# (The submodule + Netlify's shallow clone was the root cause of every
# post-March cloud deploy failure — it saw no theme layouts.)
command = "hugo --gc --minify"
HUGO_VERSION = "0.167.0"
HUGO_ENV = "production"

[context.production.environment]
HUGO_ENABLEGITINFO = "true"

[context.deploy-preview.environment]
HUGO_ENV = "preview"

[[plugins]]
  package = "netlify-plugin-inline-source"
  [plugins.inputs]
    attribute = "inline"
    compress = true
    pretty = false
    ignore = []
    svgAsImage = false

[[plugins]]
package = "netlify-plugin-image-optim"
