[build]
publish = "public"
# The dream theme is VENDORED as plain files (no git submodule), so the build
# is deterministic and needs no submodule init.
# Hugo version is made DETERMINISTIC: Netlify's Hugo toolchain does not yet
# cache v0.167.0, so a HUGO_VERSION=0.167.0 pin silently falls back to an
# older default Hugo that cannot build this theme (exit 2) — the root cause
# of every post-March cloud deploy failure (local builds always passed). We
# download the exact Hugo release in the build and run ./hugo, so the version
# can never drift.
command = "curl -sL https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_linux-amd64.tar.gz | tar xz && ./hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.167.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
# Edge functions injected at deploy time (__csp-nonce, ua_blocker_*) import
# @netlify/blobs, installed from package.json; it requires Node >= 22.12.
NODE_VERSION = "22"

[context.deploy-preview.environment]
HUGO_ENV = "preview"

[[plugins]]
  package = "netlify-plugin-inline-source"
  [plugins.inputs]
    attribute = "inline"
    compress = true
    pretty = false
    ignore = []
    svgAsImage = false

[[plugins]]
package = "netlify-plugin-image-optim"
