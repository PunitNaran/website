<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    .skills-perspective {
        perspective: 1200px;
        width: 100%;
        max-width: 800px;
        /* Wider for 14 axes */
        margin: 3rem auto;
        cursor: grab;
        /* Breathing room */
    }

    .skills-card-3d {
        position: relative;
        width: 100%;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 20px;
        transition: transform 0.1s ease-out;
        /* Smooth follow */
        transform-style: preserve-3d;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        /* For glare */
    }

    /* Floating effect for content */
    .skills-card-3d canvas {
        transform: translateZ(60px) scale(0.95);
        /* Pop out more */
    }

    /* GLARE EFFECT */
    .skills-glare {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(125deg,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0.05) 50%,
                rgba(255, 255, 255, 0) 60%);
        transform: translateZ(1px);
        /* Just above bg */
        pointer-events: none;
        mix-blend-mode: overlay;
    }

    .skills-tooltip {
        pointer-events: none;
        /* Let clicks pass through */
    }
</style>

<div class="skills-perspective" id="perspectiveContainer">
    <div class="skills-card-3d" id="tiltCard">
        <div class="skills-glare" id="glare"></div>
        <canvas id="skillsChart" height="500"></canvas>
    </div>
    <p class="text-center text-xs text-gray-400 mt-6 tracking-widest uppercase opacity-70">
        <ion-icon name="cube-outline" class="align-middle mr-1"></ion-icon>
        Interactive 3D Skill Matrix
    </p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const ctx = document.getElementById('skillsChart').getContext('2d');
        const container = document.getElementById('perspectiveContainer');
        const card = document.getElementById('tiltCard');
        const glare = document.getElementById('glare');

        // --- THEME DETECTION ---
        const isDark = document.documentElement.classList.contains('dark');
        let textColor = isDark ? '#cbd5e1' : '#4b5563';
        let gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';
        // Transparent backdrop for cleaner look with many axes
        let backdropColor = 'rgba(0,0,0,0)';

        // --- EXPANDED DATA (14 Skills: CV + Hacking/Quantum + AI) ---
        const data = {
            labels: [
                'GoLang',              // CV
                'Python',              // CV
                'C/C++',               // CV
                'Ethical Hacking',     // Added
                'Quantum Computing',   // Added
                'AI & LLMs',           // Added
                'Rust',                // CV
                'Cryptography',        // CV
                'Cloud Architecture',  // CV (AWS/GCP)
                'DevSecOps',           // CV
                'Embedded ',           // CV
                'Java',                // CV
                'C#',                  // CV
                'Microservices'        // Added
            ],
            datasets: [{
                label: 'Proficiency',
                // Adjusted data to flow nicely around the wheel
                data: [100, 95, 88, 85, 90, 96, 85, 88, 92, 94, 90, 75, 75, 95],
                fill: true,
                backgroundColor: 'rgba(99, 102, 241, 0.15)', // Indigo fade
                borderColor: '#6366f1',
                borderWidth: 2,
                pointBackgroundColor: isDark ? '#1e1e1e' : '#fff',
                pointBorderColor: '#6366f1', // Indigo point border
                pointHoverBackgroundColor: '#6366f1',
                pointHoverBorderColor: '#fff',
                pointRadius: 3, // Smaller points for density
                pointHoverRadius: 6
            }]
        };

        const config = {
            type: 'radar',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false, // Allow height control
                layout: { padding: 10 },
                elements: {
                    line: { tension: 0.3 } // Organic curve
                },
                scales: {
                    r: {
                        angleLines: { color: gridColor },
                        grid: { color: gridColor },
                        pointLabels: {
                            color: textColor,
                            font: { size: 10, family: "'Outfit', sans-serif", weight: '600' }, // Smaller font
                            backdropColor: backdropColor,
                            padding: 12 // Push labels out slightly
                        },
                        ticks: { display: false, backdropColor: 'transparent' },
                        suggestedMin: 40, // Focus on outer edge
                        suggestedMax: 100
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: isDark ? 'rgba(0,0,0,0.95)' : 'rgba(255,255,255,0.95)',
                        titleColor: isDark ? '#fff' : '#000',
                        bodyColor: isDark ? '#ccc' : '#444',
                        borderColor: '#6366f1',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false,
                        cornerRadius: 8
                    }
                }
            }
        };

        let chart = new Chart(ctx, config);

        // --- 3D TILT INTERACTION WITH GLARE ---
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            // Calculate center
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            // Get rotation values (-12 to 12 degrees - slightly subtler)
            const rotateX = ((y - centerY) / centerY) * -12; // Invert Y
            const rotateY = ((x - centerX) / centerX) * 12;

            // Glare position (Opposite to movement)
            const glareX = 50 + (x / rect.width) * 100;
            const glareY = 50 + (y / rect.height) * 100;

            // Apply transform
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%)`;
        });

        // Reset on leave
        container.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            glare.style.background = `rgba(255,255,255,0)`;
        });

        container.addEventListener('mouseenter', () => {
            card.style.transition = 'none'; // Instant follow on enter
        });
        container.addEventListener('mouseleave', () => {
            card.style.transition = 'transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)'; // Smooth spring reset
        });


        // --- DYNAMIC THEME UPDATER ---
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    const newIsDark = document.documentElement.classList.contains('dark');
                    const newTextColor = newIsDark ? '#cbd5e1' : '#4b5563';
                    const newGridColor = newIsDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';

                    chart.options.scales.r.pointLabels.color = newTextColor;
                    chart.options.scales.r.angleLines.color = newGridColor;
                    chart.options.scales.r.grid.color = newGridColor;
                    chart.options.plugins.tooltip.backgroundColor = newIsDark ? 'rgba(0,0,0,0.95)' : 'rgba(255,255,255,0.95)';
                    chart.options.plugins.tooltip.titleColor = newIsDark ? '#fff' : '#000';
                    chart.options.plugins.tooltip.bodyColor = newIsDark ? '#ccc' : '#444';

                    chart.update();
                }
            });
        });
        observer.observe(document.documentElement, { attributes: true });
    });
</script>
