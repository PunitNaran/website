<nav x-data="{ isSticky: false, mobileOpen: false }" x-init="window.addEventListener('scroll', () => { isSticky = window.scrollY > 30 })"
    class="sticky top-0 z-30 flex items-center justify-between py-4 px-6 transition-all duration-300 backdrop-blur-md bg-white/70 dark:bg-black/50 border-b border-gray-200 dark:border-gray-800"
    :class="{ 'shadow-lg': isSticky }">

    <!-- Left: Avatar / Logo -->
    <div class="flex items-center" style="gap: 1rem;">
        <div class="avatar cursor-pointer hover:scale-110 transition-transform" @click="flip = !flip"
            title="Flip to About Me">
            <div class="h-10 w-10 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
                <img src="{{ site.Params.avatar | relURL }}" alt="{{ site.Params.headerTitle }}" />
            </div>
        </div>
        <div class="flex flex-col">
            <a href="{{ site.BaseURL }}"
                class="text-xl font-bold font-heading text-primary hover:opacity-80 transition-opacity">
                {{ site.Params.headerTitle }}
            </a>
            <span class="text-xs text-gray-500 dark:text-gray-400 opacity-70 hidden sm:block">{{ site.Params.motto
                }}</span>
        </div>
    </div>

    <!-- Right: Navigation Items - STRICT SPACING -->
    <div class="hidden md:flex items-center" style="gap: 1.5rem;">
        <a href="{{ site.BaseURL }}" class="nav-link">Home</a>
        <a href="/posts" class="nav-link">Posts</a>
        <a href="/categories" class="nav-link">Categories</a>
        <a href="/tags" class="nav-link">Tags</a>

        <!-- About Toggles the Flip -->
        <button @click="flip = !flip" class="nav-link focus:outline-none">
            About
        </button>

        <!-- Settings Trigger -->
        <!-- Settings Trigger -->
        <button onclick="if(window.toggleSettings) window.toggleSettings();" class="btn btn-ghost btn-circle btn-sm"
            title="Settings">
            <ion-icon name="options-outline" class="text-xl"></ion-icon>
        </button>

        <!-- Theme Switcher -->
        <button class="btn btn-ghost btn-circle btn-sm hover:rotate-12 transition-transform"
            style="margin-right: 0.5rem;" @click="$store.darkMode.toggle($store.darkMode.isDark() ? 'n' : 'y')">
            <span class="text-xl" x-show="$store.darkMode.isDark()">◑</span>
            <span class="text-xl" x-show="!$store.darkMode.isDark()">☀</span>
        </button>

        <!-- Search Focus -->
        <button
            onclick="if(document.getElementById('post-search')){document.getElementById('post-search').focus(); window.scrollTo({top:0, behavior:'smooth'});}else{window.location.href='/';}"
            class="btn btn-ghost btn-circle btn-sm hidden md:inline-flex" title="Search">
            <ion-icon name="search" class="text-xl"></ion-icon>
        </button>
    </div>

    <!-- Mobile: hamburger — must be a direct child of <nav>, NOT inside the
         hidden md:flex row above (or it inherits display:none). -->
    <button @click="mobileOpen = !mobileOpen"
        class="md:hidden"
        :aria-expanded="mobileOpen" aria-label="Menu">
        <ion-icon :name="mobileOpen ? 'close' : 'menu'" class="text-xl"></ion-icon>
    </button>

    <!-- Mobile panel: full nav items, 44px rows, solid background -->
    <div x-show="mobileOpen" x-cloak
        @click.outside="mobileOpen = false"
        class="absolute top-full left-0 right-0 z-40 shadow-lg">
        <a href="{{ site.BaseURL }}" @click="mobileOpen = false"
            class="block px-6 py-3 border-b border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-200">Home</a>
        <a href="/posts" @click="mobileOpen = false"
            class="block px-6 py-3 border-b border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-200">Posts</a>
        <a href="/categories" @click="mobileOpen = false"
            class="block px-6 py-3 border-b border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-200">Categories</a>
        <a href="/tags" @click="mobileOpen = false"
            class="block px-6 py-3 border-b border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-200">Tags</a>
        <button @click="flip = !flip; mobileOpen = false"
            class="block w-full text-left px-6 py-3 border-b border-gray-100 dark:border-gray-800 text-gray-800 dark:text-gray-200">About</button>
        <button onclick="if(window.toggleSettings){window.toggleSettings(); mobileOpen = false;}"
            class="block w-full text-left px-6 py-3 text-gray-800 dark:text-gray-200">Settings</button>
    </div>
</nav>
