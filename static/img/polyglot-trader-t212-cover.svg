<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#1a1408"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#f5b942" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#e8842c"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- full-bleed network mesh: lines + nodes -->
  <g stroke="#2c3e5e" stroke-width="1.5" opacity="0.85">
    <line x1="0"    y1="210"  x2="420"  y2="330"/>
    <line x1="420"  y1="330"  x2="780"  y2="190"/>
    <line x1="780"  y1="190"  x2="1240" y2="320"/>
    <line x1="1240" y1="320"  x2="1680" y2="180"/>
    <line x1="1680" y1="180"  x2="1920" y2="300"/>
    <line x1="0"    y1="880"  x2="380"  y2="760"/>
    <line x1="380"  y1="760"  x2="860"  y2="900"/>
    <line x1="860"  y1="900"  x2="1330" y2="770"/>
    <line x1="1330" y1="770"  x2="1760" y2="910"/>
    <line x1="1760" y1="910"  x2="1920" y2="820"/>
  </g>
  <g stroke="url(#gold)" stroke-width="2.5" opacity="0.55">
    <line x1="1240" y1="320" x2="1440" y2="540"/>
    <line x1="1440" y1="540" x2="1680" y2="700"/>
    <line x1="1680" y1="700" x2="1920" y2="640"/>
    <line x1="780"  y1="190" x2="980"  y2="420"/>
    <line x1="980"  y1="420" x2="860"  y2="900"/>
    <line x1="420"  y1="330" x2="380"  y2="760"/>
  </g>
  <g fill="#f5b942">
    <circle cx="780"  cy="190"  r="5"   opacity="0.9"/>
    <circle cx="1240" cy="320"  r="7"   opacity="1"/>
    <circle cx="1440" cy="540"  r="5"   opacity="0.85"/>
    <circle cx="1680" cy="700"  r="6"   opacity="0.8"/>
    <circle cx="980"  cy="420"  r="6"   opacity="0.9"/>
    <circle cx="860"  cy="900"  r="5"   opacity="0.7"/>
    <circle cx="380"  cy="760"  r="5"   opacity="0.6"/>
    <circle cx="420"  cy="330"  r="4"   opacity="0.55"/>
    <circle cx="1680" cy="180"  r="4"   opacity="0.5"/>
    <circle cx="1760" cy="910"  r="5"   opacity="0.55"/>
  </g>
  <g stroke="#3b4f78" stroke-width="1" opacity="0.5">
    <line x1="0" y1="540"  x2="1920" y2="540"/>
    <line x1="0" y1="720"  x2="1920" y2="720"/>
  </g>

  <!-- title block: horizontal, bottom-left, with gold rule -->
  <rect x="120" y="770" width="120" height="6" rx="3" fill="url(#gold)"/>
  <text x="120" y="860" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="86" font-weight="800" fill="#f5f7fa" letter-spacing="-1">Polyglot Trader T212</text>
  <text x="120" y="930" font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif" font-size="40" font-weight="500" fill="#9fb0cc">The dual-threshold brain, the 11-gate risk matrix, atomic state.</text>
</svg>
